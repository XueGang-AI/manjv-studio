# ============================================
# AI 漫剧平台 — 一键启动（本地开发/演示）
# ============================================
#
# 使用前：
#   1. cp .env.example .env  并按需填写 AI Provider 凭证
#   2. docker compose up -d --build
#   3. 访问 http://localhost:3100
#
# 说明：
#   - DATABASE_URL / REDIS_URL 由下方 environment 强制指向容器内服务名，
#     会覆盖 .env 中的同名值（.env 里写 localhost 也不影响）。
#   - 数据库 schema 同步与 seed 在 web 容器首次启动时自动完成。
#   - 演示无 API Key 时，在 .env 中设 USE_MOCK_MODEL=true 可跑通全流程。
#   - 重置数据：docker compose down -v

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: manjv
      POSTGRES_PASSWORD: manjv
      POSTGRES_DB: manjv_studio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manjv -d manjv_studio"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ROLE: web
      NODE_ENV: production
      # 强制指向容器内服务（覆盖 .env 中的 localhost 值）
      DATABASE_URL: postgresql://manjv:manjv@postgres/manjv_studio?schema=public
      REDIS_URL: redis://redis
      REDIS_KEY_PREFIX: "manjv_studio:"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3100:3100"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ROLE: worker
      NODE_ENV: production
      DATABASE_URL: postgresql://manjv:manjv@postgres/manjv_studio?schema=public
      REDIS_URL: redis://redis
      REDIS_KEY_PREFIX: "manjv_studio:"
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    # 覆盖默认 CMD，worker 不走 next start
    command: ["npm", "run", "worker"]

volumes:
  pgdata:
  uploads:
